<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>平潭之旅 · Geo & Rae · 清明 2026</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --blue: #0ea5e9; --blue-dark: #0369a1; --orange: #f97316; --orange-light: #fdba74;
  --cyan: #22d3ee; --emerald: #10b981; --violet: #8b5cf6; --rose: #f43f5e;
  --sand: #fef3c7; --glass: rgba(255,255,255,0.82); --glass-dark: rgba(15,23,42,0.75);
  --day1: #6366f1; --day2: #f59e0b; --day3: #10b981; --day4: #8b5cf6;
  --radius: 16px; --shadow: 0 8px 32px rgba(0,0,0,0.12);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Noto Sans SC',system-ui,sans-serif; overflow:hidden; height:100vh; height:100dvh; width:100vw; background:#0f172a; -webkit-overflow-scrolling:touch; }

/* ===== MAP ===== */
#map { position:absolute; inset:0; z-index:1; }
.leaflet-control-attribution { font-size:10px!important; opacity:0.6; }

/* ===== STATUS BAR ===== */
#status-bar {
  position:fixed; top:0; left:0; right:0; z-index:1000; height:56px;
  background: linear-gradient(135deg, rgba(15,23,42,0.88), rgba(30,41,59,0.92));
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom:1px solid rgba(255,255,255,0.08);
  display:flex; align-items:center; padding:0 20px; gap:16px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.3);
}
#status-bar .logo { font-size:18px; font-weight:700; color:#fff; white-space:nowrap; letter-spacing:1px; }
#status-bar .logo span { background:linear-gradient(135deg,var(--cyan),var(--blue)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
#status-now { flex:1; display:flex; align-items:center; gap:12px; min-width:0; }
#status-now .pulse { width:10px; height:10px; border-radius:50%; background:var(--emerald); animation:pulse 2s infinite; flex-shrink:0; }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,0.6)} 50%{box-shadow:0 0 0 8px rgba(16,185,129,0)} }
#status-now .current { color:#e2e8f0; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#status-next { display:flex; align-items:center; gap:8px; color:var(--orange-light); font-size:13px; white-space:nowrap; }
#status-next svg { flex-shrink:0; }
.status-countdown { background:rgba(255,255,255,0.1); padding:3px 10px; border-radius:20px; font-size:12px; color:var(--cyan); font-weight:500; }

/* ===== DAY TABS ===== */
#day-tabs {
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:1000;
  display:flex; gap:6px; padding:6px;
  background:var(--glass-dark); backdrop-filter:blur(16px); border-radius:28px;
  box-shadow:var(--shadow); border:1px solid rgba(255,255,255,0.1);
}
.day-tab {
  padding:8px 20px; border-radius:22px; border:none; cursor:pointer;
  font-size:13px; font-weight:600; font-family:inherit; transition:all .3s;
  color:rgba(255,255,255,0.6); background:transparent; white-space:nowrap;
}
.day-tab:hover { color:#fff; background:rgba(255,255,255,0.1); }
.day-tab.active { color:#fff; }
.day-tab[data-day="1"].active { background:var(--day1); }
.day-tab[data-day="2"].active { background:var(--day2); }
.day-tab[data-day="3"].active { background:var(--day3); }
.day-tab[data-day="4"].active { background:var(--day4); }
.day-tab[data-day="0"].active { background:var(--blue-dark); }

/* ===== TIMELINE SIDEBAR ===== */
#timeline {
  position:fixed; top:56px; left:0; bottom:0; width:320px; z-index:900;
  background:linear-gradient(180deg, rgba(15,23,42,0.92), rgba(15,23,42,0.88));
  backdrop-filter:blur(16px); overflow-y:auto; padding:16px 0;
  border-right:1px solid rgba(255,255,255,0.06);
  transition:transform .4s cubic-bezier(.4,0,.2,1);
  scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.15) transparent;
}
#timeline::-webkit-scrollbar { width:4px; }
#timeline::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:2px; }
#timeline.collapsed { transform:translateX(-320px); }
#timeline-toggle {
  position:fixed; top:68px; left:320px; z-index:901; width:32px; height:48px;
  background:var(--glass-dark); backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.1); border-left:none;
  border-radius:0 12px 12px 0; cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:left .4s cubic-bezier(.4,0,.2,1); color:rgba(255,255,255,0.6);
}
#timeline-toggle:hover { color:#fff; }
#timeline-toggle.collapsed { left:0; }
#timeline-toggle svg { transition:transform .3s; }
#timeline-toggle.collapsed svg { transform:rotate(180deg); }

.tl-day-header {
  padding:8px 20px; margin:8px 0 4px; font-size:11px; font-weight:700;
  text-transform:uppercase; letter-spacing:2px; color:rgba(255,255,255,0.4);
}
.tl-item {
  display:flex; gap:12px; padding:10px 16px 10px 20px; cursor:pointer;
  border-left:3px solid transparent; transition:all .25s; position:relative;
}
.tl-item:hover { background:rgba(255,255,255,0.05); }
.tl-item.active { background:rgba(255,255,255,0.08); }
.tl-item[data-day="1"].active { border-left-color:var(--day1); }
.tl-item[data-day="2"].active { border-left-color:var(--day2); }
.tl-item[data-day="3"].active { border-left-color:var(--day3); }
.tl-item[data-day="4"].active { border-left-color:var(--day4); }
.tl-item.past { opacity:0.45; }
.tl-item.now .tl-time { color:var(--cyan); }
.tl-time { font-size:12px; color:rgba(255,255,255,0.5); width:44px; flex-shrink:0; padding-top:2px; font-weight:500; font-variant-numeric:tabular-nums; }
.tl-icon { width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
.tl-info { flex:1; min-width:0; }
.tl-title { font-size:13px; font-weight:600; color:#e2e8f0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tl-subtitle { font-size:11px; color:rgba(255,255,255,0.4); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tl-item.optional { border-left-style:dashed; opacity:0.65; }
.tl-item.optional .tl-title::after { content:'选'; font-size:9px; background:rgba(255,255,255,0.12); padding:1px 5px; border-radius:4px; margin-left:6px; vertical-align:middle; }

/* ===== DETAIL PANEL ===== */
#detail-panel {
  position:fixed; top:56px; right:-420px; bottom:0; width:400px; z-index:950;
  background:linear-gradient(180deg, rgba(15,23,42,0.95), rgba(15,23,42,0.92));
  backdrop-filter:blur(20px); overflow-y:auto; transition:right .4s cubic-bezier(.4,0,.2,1);
  border-left:1px solid rgba(255,255,255,0.08); box-shadow:-8px 0 32px rgba(0,0,0,0.2);
  scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.15) transparent;
}
#detail-panel::-webkit-scrollbar { width:4px; }
#detail-panel::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:2px; }
#detail-panel.open { right:0; }
#detail-close {
  position:absolute; top:12px; right:12px; z-index:10; width:32px; height:32px;
  background:rgba(255,255,255,0.08); border:none; border-radius:50%; cursor:pointer;
  color:rgba(255,255,255,0.6); font-size:18px; display:flex; align-items:center; justify-content:center;
}
#detail-close:hover { background:rgba(255,255,255,0.15); color:#fff; }

.detail-header { padding:24px 20px 16px; position:relative; }
.detail-header .badge { display:inline-block; padding:3px 10px; border-radius:12px; font-size:11px; font-weight:600; margin-bottom:8px; }
.detail-header h2 { font-size:20px; font-weight:700; color:#fff; line-height:1.3; margin-bottom:4px; }
.detail-header .sub { font-size:13px; color:rgba(255,255,255,0.5); }
.detail-time-badge { display:inline-flex; align-items:center; gap:4px; font-size:12px; color:var(--cyan); margin-top:8px; }
.detail-body { padding:0 20px 24px; }
.detail-desc { font-size:14px; color:rgba(255,255,255,0.75); line-height:1.7; margin-bottom:16px; }

.detail-section { margin-bottom:16px; }
.detail-section-title {
  font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:1.5px;
  margin-bottom:8px; display:flex; align-items:center; gap:6px;
}
.detail-section-title.tips { color:var(--orange); }
.detail-section-title.photo { color:var(--rose); }
.detail-section-title.food { color:var(--emerald); }
.detail-section-title.tears { color:var(--cyan); }

.detail-tip {
  font-size:13px; color:rgba(255,255,255,0.65); line-height:1.6;
  padding:6px 0 6px 16px; position:relative;
}
.detail-tip::before { content:''; position:absolute; left:0; top:12px; width:6px; height:6px; border-radius:50%; }
.tips .detail-tip::before { background:var(--orange); }
.photo .detail-tip::before { background:var(--rose); }
.food .detail-tip::before { background:var(--emerald); }
.tears .detail-tip::before { background:var(--cyan); }
.detail-tip.highlight { color:#fff; font-weight:500; }

.tears-spots { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
.tear-spot {
  padding:10px 12px; border-radius:10px; background:rgba(34,211,238,0.08);
  border:1px solid rgba(34,211,238,0.15); cursor:pointer; transition:all .2s;
}
.tear-spot:hover { background:rgba(34,211,238,0.15); transform:translateX(4px); }
.tear-spot .name { font-size:13px; font-weight:600; color:var(--cyan); }
.tear-spot .desc { font-size:12px; color:rgba(255,255,255,0.5); margin-top:2px; }

/* ===== WEATHER TOGGLE ===== */
.weather-toggle {
  display:flex; gap:4px; margin:12px 0; padding:4px; background:rgba(255,255,255,0.06); border-radius:12px;
}
.weather-btn {
  flex:1; padding:8px; border:none; border-radius:10px; cursor:pointer;
  font-size:12px; font-weight:600; font-family:inherit; transition:all .2s;
  color:rgba(255,255,255,0.5); background:transparent;
}
.weather-btn.active { color:#fff; background:var(--day2); }

/* ===== CUSTOM MAP MARKERS ===== */
.custom-marker {
  width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:16px; color:#fff; box-shadow:0 2px 8px rgba(0,0,0,0.3);
  border:2px solid rgba(255,255,255,0.9); transition:transform .2s;
  cursor:pointer; position:relative;
}
.custom-marker:hover { transform:scale(1.2); }
.custom-marker.active-marker { transform:scale(1.4); border-color:#fff; box-shadow:0 0 0 4px rgba(255,255,255,0.4), 0 0 24px rgba(14,165,233,0.7); z-index:9000!important; animation:markerPulse 1.5s infinite; }
@keyframes markerPulse { 0%,100%{box-shadow:0 0 0 4px rgba(255,255,255,0.4), 0 0 24px rgba(14,165,233,0.6)} 50%{box-shadow:0 0 0 8px rgba(255,255,255,0.2), 0 0 36px rgba(14,165,233,0.9)} }
.custom-marker.type-transit { background:linear-gradient(135deg,#6366f1,#818cf8); }
.custom-marker.type-hotel { background:linear-gradient(135deg,#f59e0b,#fbbf24); }
.custom-marker.type-scenic { background:linear-gradient(135deg,#10b981,#34d399); }
.custom-marker.type-food { background:linear-gradient(135deg,#f97316,#fb923c); }
.custom-marker.type-blue-tears { background:linear-gradient(135deg,#06b6d4,#22d3ee); animation:glow 2s infinite; }
.custom-marker.type-camera { background:linear-gradient(135deg,#ec4899,#f472b6); }
.custom-marker.type-optional { opacity:0.7; border-style:dashed; }
@keyframes glow { 0%,100%{box-shadow:0 0 8px rgba(34,211,238,0.4)} 50%{box-shadow:0 0 20px rgba(34,211,238,0.8)} }

.marker-time {
  position:absolute; bottom:100%; left:50%; transform:translateX(-50%); margin-bottom:4px;
  white-space:nowrap; font-size:10px; font-weight:700; color:#fff;
  background:rgba(14,165,233,0.85); padding:1px 6px; border-radius:8px;
  text-shadow:0 1px 2px rgba(0,0,0,0.5); pointer-events:none;
  letter-spacing:0.5px; line-height:1.4;
  box-shadow:0 2px 6px rgba(0,0,0,0.3);
}
.marker-label {
  position:absolute; top:100%; left:50%; transform:translateX(-50%); margin-top:4px;
  white-space:nowrap; font-size:11px; font-weight:600; color:#fff;
  text-shadow:0 1px 4px rgba(0,0,0,0.8); pointer-events:none;
}

/* ===== ROUTE LINES ===== */
.route-day1 { stroke:var(--day1); }
.route-day2 { stroke:var(--day2); }
.route-day3 { stroke:var(--day3); }
.route-day4 { stroke:var(--day4); }

/* ===== RESPONSIVE ===== */
@media (max-width:768px) {
  #status-bar { height:48px; padding:0 12px; gap:8px; }
  #status-bar .logo { font-size:15px; }
  #status-now .current { font-size:12px; }
  #status-next { font-size:11px; }
  .status-countdown { font-size:11px; padding:2px 8px; }
  #timeline { width:100%; top:48px; height:45vh; bottom:auto; border-right:none; border-bottom:1px solid rgba(255,255,255,0.08); border-radius:0 0 16px 16px; }
  #timeline.collapsed { transform:translateY(-100%); }
  #timeline-toggle { top:48px; left:50%; transform:translateX(-50%); width:48px; height:28px; border-radius:0 0 12px 12px; border:1px solid rgba(255,255,255,0.1); border-top:none; }
  #timeline-toggle.collapsed { top:48px; left:50%; }
  #timeline-toggle svg { transform:rotate(-90deg); }
  #timeline-toggle.collapsed svg { transform:rotate(90deg); }
  #detail-panel { width:100%; right:-100%; top:48px; }
  #day-tabs { bottom:12px; gap:3px; padding:4px; }
  .day-tab { padding:7px 11px; font-size:11px; border-radius:18px; }
  .custom-marker { width:30px; height:30px; font-size:13px; }
  .marker-label { font-size:9px; }
  .marker-time { font-size:8px; padding:1px 4px; }
  #trip-title { top:48px; }
  #trip-title h1 { font-size:clamp(28px,8vw,42px); }
  .detail-header h2 { font-size:17px; }
  .detail-desc { font-size:13px; }
  .detail-tip { font-size:12px; }
}

/* ===== TRIP TITLE OVERLAY ===== */
#trip-title {
  position:fixed; top:56px; left:0; right:0; bottom:0; z-index:2000;
  background:linear-gradient(135deg, rgba(15,23,42,0.97), rgba(30,58,95,0.95));
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:opacity .8s, visibility .8s; cursor:pointer;
}
#trip-title.hidden { opacity:0; visibility:hidden; pointer-events:none; }
#trip-title h1 {
  font-size:clamp(32px,6vw,56px); font-weight:900; color:#fff;
  background:linear-gradient(135deg,var(--cyan),var(--blue),var(--violet));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  margin-bottom:12px; text-align:center;
}
#trip-title .names { font-size:clamp(16px,3vw,22px); color:rgba(255,255,255,0.6); font-weight:300; margin-bottom:8px; }
#trip-title .dates { font-size:14px; color:rgba(255,255,255,0.35); letter-spacing:2px; }
#trip-title .enter { margin-top:40px; font-size:13px; color:rgba(255,255,255,0.3); animation:fadeInUp 2s infinite; }
@keyframes fadeInUp { 0%,100%{opacity:0.3;transform:translateY(0)} 50%{opacity:0.7;transform:translateY(-6px)} }
</style>
</head>
<body>

<!-- TITLE SCREEN -->
<div id="trip-title" onclick="enterTrip()">
  <div class="names">Geo & Rae</div>
  <h1>平潭之旅</h1>
  <div class="dates">2026.04.03 — 04.06 · 清明假期</div>
  <div class="enter">点击进入旅行计划 →</div>
</div>

<!-- STATUS BAR -->
<div id="status-bar">
  <div class="logo">🌊 <span>平潭之旅</span></div>
  <div id="status-now">
    <div class="pulse"></div>
    <div class="current" id="status-current-text">加载中...</div>
  </div>
  <div id="status-next">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    <span id="status-next-text"></span>
  </div>
  <div class="status-countdown" id="status-countdown"></div>
</div>

<!-- MAP -->
<div id="map"></div>

<!-- TIMELINE TOGGLE -->
<div id="timeline-toggle" onclick="toggleTimeline()">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
</div>

<!-- TIMELINE SIDEBAR -->
<div id="timeline"></div>

<!-- DETAIL PANEL -->
<div id="detail-panel">
  <button id="detail-close" onclick="closeDetail()">&times;</button>
  <div id="detail-content"></div>
</div>

<!-- DAY TABS -->
<div id="day-tabs">
  <button class="day-tab" data-day="0" onclick="switchDay(0)">全览</button>
  <button class="day-tab" data-day="1" onclick="switchDay(1)">Day1 福州</button>
  <button class="day-tab" data-day="2" onclick="switchDay(2)">Day2 抵潭</button>
  <button class="day-tab" data-day="3" onclick="switchDay(3)">Day3 环岛</button>
  <button class="day-tab" data-day="4" onclick="switchDay(4)">Day4 归程</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ============================
// DATA
// ============================
const ICONS = {
  train:'🚄', hotel:'🏨', food:'🍽', camera:'📸', sunset:'🌅',
  mountain:'⛰', beach:'🏖', stars:'✨', road:'🛣', walk:'🚶'
};
const DAY_COLORS = ['#0ea5e9','#6366f1','#f59e0b','#10b981','#8b5cf6'];
const DAY_LABELS = ['全览','Day 1 · 4/3 周五','Day 2 · 4/4 周六','Day 3 · 4/5 周日','Day 4 · 4/6 周一'];

const schedule = [
  // ===== DAY 1 =====

    type:'transit', icon:'train', lat:31.820, lng:117.308,
    desc:'穿越皖南大地，从江淮平原到徽州山区。窗外风景渐入佳境。',
    tips:['车程约3小时，可以休息补觉','提前准备零食和水，车上也可以买','建议提前下载好离线地图和平潭攻略'],
  },
  { id:'d1-2', day:1, date:'2026-04-03', startTime:'16:16', endTime:'16:22',
    title:'黄山北站 · 同站换乘', subtitle:'仅停留6分钟！',
    type:'transit', icon:'train', lat:29.731, lng:118.316,
    desc:'同站台换乘或同站不同站台换乘。6分钟时间紧张，需要提前做好准备。',
    tips:['⚠️ 仅6分钟换乘，到站前就站到车门口','查看车票上的车厢号，提前确认下一趟车的候车信息','不要出站！在站内直接换乘','行李精简，快速移动'],
  },
  { id:'d1-3', day:1, date:'2026-04-03', startTime:'16:22', endTime:'18:44',
    title:'黄山北 → 福州', subtitle:'G1629 · 第二程高铁',
    type:'transit', icon:'train', lat:29.731, lng:118.316, endLat:26.049, endLng:119.308,
    desc:'翻越武夷山脉进入福建，沿途闽北山水秀美。约2.5小时车程。',

  { id:'d1-4', day:1, date:'2026-04-03', startTime:'18:44', endTime:'19:15',
    title:'到达福州站 → 入住酒店', subtitle:'全季福州上下杭五一南路酒店',

    desc:'高级大床房，含早餐1份（金会员入住）。酒店位于上下杭历史街区核心地段，五一南路215号，出门就是老街。',

    desc:'收拾行李，告别那片海。带着满满的回忆踏上归途。',
    tips:['前一晚收拾好行李，早起就能走','⚠️ 提前叫好车！清明节早上打车难','从民宿到平潭站约20分钟','可以在民宿打包早餐或提前买好面包','最后看一眼窗外的海和风车 🌊'],
  },
  { id:'d4-2', day:4, date:'2026-04-06', startTime:'08:08', endTime:'09:00',
    title:'平潭 → 福州南', subtitle:'G1634 · 返程第一段',
    type:'transit', icon:'train', lat:25.507, lng:119.728, endLat:25.988, endLng:119.351,

  },
  { id:'d4-3', day:4, date:'2026-04-06', startTime:'09:36', endTime:'14:00',
    title:'福州南 → 合肥南', subtitle:'G3206 · 回家',
    type:'transit', icon:'train', lat:25.988, lng:119.351, endLat:31.820, endLng:117.308,
    desc:'返程最后一段，约4.5小时。在车上整理照片、回味这趟旅程的美好时光。',
    tips:['车上可以一起整理这几天的照片，选出最满意的','给平潭的民宿留个好评','回味一下时来运转的味道，计划下次再来','预计下午2点左右到合肥，回家休息'],
  },
];

// ============================
// MAP INIT
// ============================
const map = L.map('map',{zoomControl:false,attributionControl:true}).setView([25.52,119.75],12);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{
  maxZoom:19, subdomains:'abcd',
  attribution:'&copy; <a href="https://carto.com/">CARTO</a> &copy; <a href="https://osm.org/copyright">OSM</a>'
}).addTo(map);

// ============================
// MAP BOUNDS
// ============================
const BOUNDS = {
  0: [[25.0,117.0],[32.0,120.0]], // overview
  1: [[25.8,119.1],[26.3,119.5]], // fuzhou
  2: [[25.38,119.55],[26.15,119.95]], // fuzhou -> pingtan
  3: [[25.40,119.65],[25.62,119.88]], // pingtan north
  4: [[25.3,117.0],[32.0,119.9]], // return
};

// ============================
// MARKERS & LAYERS
// ============================
let markers = {};
let routeLines = {};
let currentDay = 0;
let activeItemId = null;

function createMarker(item) {
  const typeClass = item.type || 'scenic';
  const optClass = item.optional ? ' type-optional' : '';
  const icon = L.divIcon({
    className:'',
    html:`<div class="custom-marker type-${typeClass}${optClass}">${item.startTime?`<div class="marker-time">${item.startTime}</div>`:''}<div class="marker-emoji">${ICONS[item.icon]||'📍'}</div><div class="marker-label">${item.title.length>8?item.title.substring(0,8)+'…':item.title}</div></div>`,
    iconSize:[36,36], iconAnchor:[18,18],
  });
  const m = L.marker([item.lat,item.lng],{icon}).on('click',()=>openDetail(item.id));
  return m;
}

// Create layer groups per day
const dayLayers = {0:L.layerGroup(), 1:L.layerGroup(), 2:L.layerGroup(), 3:L.layerGroup(), 4:L.layerGroup()};

schedule.forEach(item => {
  const m = createMarker(item);
  markers[item.id] = m;
  dayLayers[item.day].addLayer(m);

  // Sub-locations (blue tears)
  if(item.subLocations){
    item.subLocations.forEach((sub,i)=>{
      const si = L.divIcon({
        className:'',
        html:`<div class="custom-marker type-blue-tears" style="width:28px;height:28px;font-size:12px">💧<div class="marker-label" style="font-size:10px">${sub.name}</div></div>`,
        iconSize:[28,28],iconAnchor:[14,14],
      });
      const sm = L.marker([sub.lat,sub.lng],{icon:si}).on('click',()=>openDetail(item.id));
      dayLayers[item.day].addLayer(sm);
    });
  }
});

// Route lines
function createRouteLines(){
  const dayRoutes = {1:[],2:[],3:[],4:[]};
  schedule.forEach(it=>{
    if(!dayRoutes[it.day]) return;
    dayRoutes[it.day].push([it.lat,it.lng]);
    if(it.endLat) dayRoutes[it.day].push([it.endLat,it.endLng]);
  });
  [1,2,3,4].forEach(d=>{
    if(dayRoutes[d].length>1){
      routeLines[d]=L.polyline(dayRoutes[d],{color:DAY_COLORS[d],weight:3,opacity:0.6,dashArray:d===3?'':'8 6'}).addTo(map);
    }
  });
}
createRouteLines();

// ============================
// SWITCH DAY
// ============================
function switchDay(day){
  currentDay = day;
  // Update tabs
  document.querySelectorAll('.day-tab').forEach(t=>t.classList.toggle('active',+t.dataset.day===day));
  // Clear map layers
  [0,1,2,3,4].forEach(d=>map.removeLayer(dayLayers[d]));
  Object.values(routeLines).forEach(r=>map.removeLayer(r));

  if(day===0){
    // Show all
    [1,2,3,4].forEach(d=>{dayLayers[d].addTo(map); if(routeLines[d]) routeLines[d].addTo(map);});
    map.fitBounds(BOUNDS[0],{padding:[60,60],maxZoom:8});
  } else {
    dayLayers[day].addTo(map);
    if(routeLines[day]) routeLines[day].addTo(map);
    map.fitBounds(BOUNDS[day],{padding:[60,60],maxZoom:14,animate:true,duration:1});
  }
  renderTimeline(day);
  closeDetail();
}

// ============================
// TIMELINE
// ============================
function renderTimeline(day){
  const el = document.getElementById('timeline');
  let html = '';
  const items = day===0 ? schedule : schedule.filter(it=>it.day===day);
  let lastDay = 0;

  items.forEach(item => {
    if(item.day !== lastDay){
      html += `<div class="tl-day-header" style="color:${DAY_COLORS[item.day]}">${DAY_LABELS[item.day]}</div>`;
      lastDay = item.day;
    }
    const timeState = getTimeState(item);
    const bg = `background:${DAY_COLORS[item.day]}22`;
    html += `
      <div class="tl-item ${timeState} ${item.optional?'optional':''}" data-day="${item.day}" data-id="${item.id}" onclick="onTimelineClick('${item.id}')">
        <div class="tl-time">${item.startTime}</div>
        <div class="tl-icon" style="${bg}">${ICONS[item.icon]||'📍'}</div>
        <div class="tl-info">
          <div class="tl-title">${item.title}</div>
          <div class="tl-subtitle">${item.subtitle||''}</div>
        </div>
      </div>`;
  });
  el.innerHTML = html;

  // Scroll to active
  setTimeout(()=>{
    const now = el.querySelector('.tl-item.now') || el.querySelector('.tl-item.active');
    if(now) now.scrollIntoView({behavior:'smooth',block:'center'});
  },300);
}

function onTimelineClick(id){
  const item = schedule.find(s=>s.id===id);
  if(!item) return;
  map.flyTo([item.lat,item.lng], item.day<=1||item.day===4?10:14, {duration:0.8});
  openDetail(id);
  // Highlight
  document.querySelectorAll('.tl-item').forEach(e=>e.classList.remove('active'));
  const el = document.querySelector(`.tl-item[data-id="${id}"]`);
  if(el) el.classList.add('active');
}

// ============================
// DETAIL PANEL
// ============================
function highlightMarker(id){
  // Remove previous highlight
  document.querySelectorAll('.custom-marker.active-marker').forEach(el=>el.classList.remove('active-marker'));
  // Add highlight to current marker
  if(markers[id]){
    const markerEl = markers[id].getElement();
    if(markerEl){
      const cm = markerEl.querySelector('.custom-marker');
      if(cm) cm.classList.add('active-marker');
    }
  }
}

function openDetail(id){
  const item = schedule.find(s=>s.id===id);
  if(!item) return;
  activeItemId = id;
  highlightMarker(id);

  const dayColor = DAY_COLORS[item.day];
  let html = `<div class="detail-header">
    <div class="badge" style="background:${dayColor}33;color:${dayColor}">Day ${item.day} · ${item.date.split('-').slice(1).join('/')}</div>
    <h2>${item.title}</h2>
    <div class="sub">${item.subtitle||''}</div>
    <div class="detail-time-badge">🕐 ${item.startTime} — ${item.endTime}</div>
  </div><div class="detail-body">`;

  html += `<div class="detail-desc">${item.desc}</div>`;

  // Weather toggle for d2-2
  if(item.plan==='flexible'){
    html += `<div class="detail-section"><div class="detail-section-title tips">🌤 天气弹性方案</div>
      <div class="weather-toggle">
        <button class="weather-btn active" onclick="this.parentNode.querySelectorAll('.weather-btn').forEach(b=>b.classList.remove('active'));this.classList.add('active');">☀️ 平潭天气好 → 快走</button>
        <button class="weather-btn" onclick="this.parentNode.querySelectorAll('.weather-btn').forEach(b=>b.classList.remove('active'));this.classList.add('active');">🌧 天气不好 → 细逛</button>
      </div></div>`;
  }

  // Tips
  if(item.tips && item.tips.length){
    html += `<div class="detail-section tips"><div class="detail-section-title tips">💡 实用建议</div>`;
    item.tips.forEach(t=>{
      const hl = t.startsWith('⚠️')||t.startsWith('🥇')||t.startsWith('📱')||t.startsWith('★')?'highlight':'';
      html+=`<div class="detail-tip ${hl}">${t}</div>`;
    });
    html+='</div>';
  }

  // Photo tips
  if(item.photoTips && item.photoTips.length){
    html += `<div class="detail-section photo"><div class="detail-section-title photo">📸 拍照建议（Rae专属）</div>`;
    item.photoTips.forEach(t=>{
      const hl = t.startsWith('★')?'highlight':'';
      html+=`<div class="detail-tip ${hl}">${t}</div>`;
    });
    html+='</div>';
  }

  // Blue tears sub-locations
  if(item.subLocations){
    html += `<div class="detail-section tears"><div class="detail-section-title tears">🗺 追泪地点推荐</div><div class="tears-spots">`;
    item.subLocations.forEach(sub=>{
      html+=`<div class="tear-spot" onclick="map.flyTo([${sub.lat},${sub.lng}],14,{duration:0.6})">
        <div class="name">${sub.name}</div><div class="desc">${sub.desc}</div></div>`;
    });
    html+='</div></div>';
  }

  html += '</div>';
  document.getElementById('detail-content').innerHTML = html;
  document.getElementById('detail-panel').classList.add('open');
}

function closeDetail(){
  document.getElementById('detail-panel').classList.remove('open');
  document.querySelectorAll('.custom-marker.active-marker').forEach(el=>el.classList.remove('active-marker'));
  activeItemId = null;
}

// ============================
// TIMELINE TOGGLE
// ============================
function toggleTimeline(){
  document.getElementById('timeline').classList.toggle('collapsed');
  document.getElementById('timeline-toggle').classList.toggle('collapsed');
}

// ============================
// TIME LOGIC
// ============================
function parseDateTime(date,time){
  return new Date(`${date}T${time}:00+08:00`);
}
function getTimeState(item){
  const now = new Date();
  const start = parseDateTime(item.date,item.startTime);
  const end = parseDateTime(item.date,item.endTime);
  if(now < start) return '';
  if(now >= start && now <= end) return 'now';
  return 'past';
}

function updateStatus(){
  const now = new Date();
  const tripStart = parseDateTime('2026-04-03','13:12');
  const tripEnd = parseDateTime('2026-04-06','14:00');
  const curEl = document.getElementById('status-current-text');
  const nextEl = document.getElementById('status-next-text');
  const cdEl = document.getElementById('status-countdown');

  if(now < tripStart){
    const diff = tripStart - now;
    const days = Math.floor(diff/86400000);
    const hrs = Math.floor((diff%86400000)/3600000);
    curEl.textContent = `距离出发还有 ${days} 天 ${hrs} 小时`;
    nextEl.textContent = '合肥南站 G7705';
    cdEl.textContent = `${days}d ${hrs}h`;
    return;
  }
  if(now > tripEnd){
    curEl.textContent = '旅程已结束，美好的回忆永远留在心中 ✨';
    nextEl.textContent = '';
    cdEl.textContent = '完';
    document.querySelector('.pulse').style.background='#94a3b8';
    return;
  }

  // Find current & next
  let currentItem = null, nextItem = null;
  for(let i=0;i<schedule.length;i++){
    const s = parseDateTime(schedule[i].date,schedule[i].startTime);
    const e = parseDateTime(schedule[i].date,schedule[i].endTime);
    if(now>=s && now<=e && !schedule[i].optional){ currentItem=schedule[i]; nextItem=schedule[i+1]||null; break; }
    if(now<s && !schedule[i].optional){ nextItem=schedule[i]; if(i>0) currentItem=schedule[i-1]; break; }
  }
  if(currentItem){
    curEl.textContent = `${currentItem.title}`;
  } else {
    curEl.textContent = '自由活动中';
  }
  if(nextItem){
    nextEl.textContent = `${nextItem.startTime} ${nextItem.title}`;
    const diff = parseDateTime(nextItem.date,nextItem.startTime) - now;
    if(diff>0){
      const h=Math.floor(diff/3600000); const m=Math.floor((diff%3600000)/60000);
      cdEl.textContent = h>0?`${h}h ${m}m`:`${m}m`;
    }
  } else {
    nextEl.textContent='';
    cdEl.textContent='';
  }
}

// Auto-focus on current day
function autoFocusToday(){
  const now = new Date();
  for(let d=1;d<=4;d++){
    const dayItems = schedule.filter(s=>s.day===d && !s.optional);
    if(dayItems.length===0) continue;
    const dayStart = parseDateTime(dayItems[0].date, dayItems[0].startTime);
    const dayEnd = parseDateTime(dayItems[dayItems.length-1].date, dayItems[dayItems.length-1].endTime);
    if(now>=dayStart && now<=dayEnd){
      switchDay(d);
      return;
    }
  }
  // Default: if before trip show day 1, if after show overview
  const tripStart = parseDateTime('2026-04-03','13:12');
  if(now < tripStart) switchDay(0);
  else switchDay(0);
}

// ============================
// TITLE SCREEN
// ============================
function enterTrip(){
  document.getElementById('trip-title').classList.add('hidden');
  setTimeout(()=>{
    autoFocusToday();
    updateStatus();
    setInterval(updateStatus, 60000);
  },400);
}

// Init: show title screen
switchDay(0);
// Also pre-render timeline for overview
renderTimeline(0);
</script>
